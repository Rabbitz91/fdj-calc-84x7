<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dana Flowers">
<link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.json">
<title>Flowers by Dana Jarosus</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:100px}
header{position:sticky;top:0;z-index:5;background:#090909eF;backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #292929}
.top{display:flex;align-items:center;gap:10px}.brand{font-weight:800;flex:1}.total{font-size:22px;font-weight:900;color:#e3c77a}
.tabs{display:flex;gap:7px;margin-top:10px}button{border:0;border-radius:10px;background:#252525;color:#fff;padding:10px 12px;font-weight:700}
button.on,.plus{background:#b49a51;color:#090909}main{padding:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:#171717;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden}.card img{width:100%;height:130px;object-fit:cover;display:block}
.pad{padding:9px}.name{font-weight:800;min-height:38px}.meta{font-size:12px;color:#aaa;margin:5px 0}
.qty{display:flex;align-items:center;gap:6px}.qty input{width:58px;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:8px;padding:9px;text-align:center;font-size:16px}
.qty button{font-size:18px;padding:7px 12px}.line{margin-left:auto;font-weight:800}
.list .card{display:flex;margin-bottom:8px}.list .card img{width:90px;height:90px;flex:none}.list .pad{flex:1}.list .name{min-height:0}
.receipt{max-width:520px;margin:auto;background:#fff;color:#111;padding:20px;border-radius:5px}.receipt h2{text-align:center;margin:5px 0 18px}
.rr{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.sum{font-size:22px;font-weight:900;border-top:2px solid #111;padding-top:10px;margin-top:12px}
.install{font-size:12px;color:#bbb;margin-top:8px}.hidden{display:none}
</style></head>
<body><header><div class="top"><div class="brand">FLOWERS BY DANA JAROSUS</div><div class="total" id="total">0,00 €</div></div>
<div class="tabs"><button id="gbtn" class="on" onclick="mode='grid';render()">▦ NORMAL</button><button id="lbtn" onclick="mode='list';render()">☷ LISTE A–Z</button><button id="rbtn" onclick="receipt()">KASSENBON</button></div>
<div class="install">iPhone: Safari → Teilen → „Zum Home-Bildschirm“</div></header><main id="app"></main>
<script>
const P=[["Brassica Crane Queen", 0.79, 7, "Brassica_Crane_Queen.jpg", false], ["Chrysantheme Baltica Weiss", 0.79, 7, "Chrysantheme_Baltica_Weiss.jpg", false], ["Eucalyptus Cinerea Lang", 5.99, 7, "Eucalyptus_Cinerea_Lang.jpg", false], ["Eustoma Alissa Pink", 1.59, 7, "Eustoma_Alissa_Pink.jpg", false], ["Gerbera Mini Bieber", 0.59, 7, "Gerbera_Mini_Bieber.jpg", false], ["Matthiola Impala Apricot", 0.59, 7, "Matthiola_Impala_Apricot.jpg", false], ["Pistacia Lentisco", 1.39, 7, "Pistacia_Lentisco.jpg", false], ["Rose Mayfield", 0.65, 7, "Rose_Mayfield.jpg", false], ["Xerophyllum Beregras Orca", 1.89, 7, "Xerophyllum_Beregras_Orca.jpg", false], ["Steckschwamm", 0.412725, 19, "Steckschwamm.jpg", true], ["Steckschwamm Ring 24 cm", 3.14916, 19, "Steckschwamm_Ring_24cm.jpg", true], ["Papier", 0.2, 19, "Papier.jpg", true]];
let Q=JSON.parse(localStorage.getItem('danaQ')||'{}'), mode='grid';
const money=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
function gross(p){return p[1]*(1+p[2]/100)} function qty(i){return +(Q[i]||0)}
function save(){localStorage.setItem('danaQ',JSON.stringify(Q));updateTotal()}
function setq(i,v){Q[i]=Math.max(0,parseFloat(String(v).replace(',','.'))||0);save();render(false)}
function step(i,d){setq(i,qty(i)+d)}
function ordered(){return P.map((p,i)=>[p,i]).sort((a,b)=>(a[0][4]-b[0][4])||a[0][0].localeCompare(b[0][0],'de'))}
function updateTotal(){let t=P.reduce((s,p,i)=>s+gross(p)*qty(i),0);document.getElementById('total').textContent=money(t)}
function render(scroll=true){document.getElementById('gbtn').classList.toggle('on',mode==='grid');document.getElementById('lbtn').classList.toggle('on',mode==='list');document.getElementById('rbtn').classList.remove('on');
let a=document.getElementById('app');a.className=mode==='grid'?'grid':'list';a.innerHTML=ordered().map(([p,i])=>`<div class="card"><img src="images/${p[3]}"><div class="pad"><div class="name">${p[0]}</div><div class="meta">${p[1].toLocaleString('de-DE',{minimumFractionDigits:2})} € netto · ${p[2]}% MwSt.</div><div class="qty"><button onclick="step(${i},-1)">−</button><input inputmode="decimal" value="${qty(i)||''}" placeholder="0" onchange="setq(${i},this.value)"><button class="plus" onclick="step(${i},1)">+</button><span class="line">${money(gross(p)*qty(i))}</span></div></div></div>`).join('');updateTotal()}
function receipt(){document.getElementById('gbtn').classList.remove('on');document.getElementById('lbtn').classList.remove('on');document.getElementById('rbtn').classList.add('on');
let net=0,v7=0,v19=0,total=0,rows='';P.forEach((p,i)=>{let q=qty(i);if(!q)return;let n=p[1]*q,v=n*p[2]/100,g=n+v;net+=n;total+=g;if(p[2]==7)v7+=v;else v19+=v;rows+=`<div class="rr"><span>${q} × ${p[0]}</span><b>${money(g)}</b></div>`});
document.getElementById('app').className='';document.getElementById('app').innerHTML=`<div class="receipt"><h2>FLOWERS BY DANA JAROSUS</h2>${rows||'<p>Noch keine Artikel ausgewählt.</p>'}<div class="rr"><span>Netto</span><b>${money(net)}</b></div><div class="rr"><span>MwSt. 7%</span><b>${money(v7)}</b></div><div class="rr"><span>MwSt. 19%</span><b>${money(v19)}</b></div><div class="rr sum"><span>SUMME</span><span>${money(total)}</span></div><p style="text-align:center">Vielen Dank!</p></div>`}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
