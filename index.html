let Q=JSON.parse(localStorage.getItem('danaQ')||'{}'), mode='grid';
const money=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
function gross(p){return p[1]*(1+p[2]/100)} function qty(i){return +(Q[i]||0)}
function save(){localStorage.setItem('danaQ',JSON.stringify(Q));updateTotal()}
function setq(i,v){Q[i]=Math.max(0,parseFloat(String(v).replace(',','.'))||0);save();render(false)}
function step(i,d){setq(i,qty(i)+d)}
function ordered(){return P.map((p,i)=>[p,i]).sort((a,b)=>(a[0][4]-b[0][4])||a[0][0].localeCompare(b[0][0],'de'))}
function updateTotal(){let t=P.reduce((s,p,i)=>s+gross(p)*qty(i),0);document.getElementById('total').textContent=money(t)}
function render(scroll=true){document.getElementById('gbtn').classList.toggle('on',mode==='grid');document.getElementById('lbtn').classList.toggle('on',mode==='list');document.getElementById('rbtn').classList.remove('on');
let a=document.getElementById('app');a.className=mode==='grid'?'grid':'list';a.innerHTML=ordered().map(([p,i])=>`<div class="card"><img src="${p[5]}"><div class="pad"><div class="name">${p[0]}</div><div class="meta">${p[1].toLocaleString('de-DE',{minimumFractionDigits:2})} € netto · ${p[2]}% MwSt.</div><div class="qty"><button onclick="step(${i},-1)">−</button><input inputmode="decimal" value="${qty(i)||''}" placeholder="0" onchange="setq(${i},this.value)"><button class="plus" onclick="step(${i},1)">+</button><span class="line">${money(gross(p)*qty(i))}</span></div></div></div>`).join('');updateTotal()}

async function receiptBlob(){
  const el=document.querySelector('.receipt');
  if(!el) throw new Error('Kein Kassenbon geöffnet');
  if(typeof html2canvas==='undefined') throw new Error('Bildgenerator konnte nicht geladen werden');
  const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
  return await new Promise(resolve=>canvas.toBlob(resolve,'image/png',1));
}
